[package]
name = "explorer"
version = "0.1.0"
edition = "2024"
description = "A small native file explorer built with Dioxus and Blitz"
license = "MIT"

[dependencies]
# 0.7.10's Config requires the CLI config dependency supplied by hot-reload.
dioxus-native = { version = "=0.7.10", default-features = false, features = ["prelude", "accessibility", "net", "svg", "system-fonts", "clipboard", "hot-reload", "autofocus"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
directories = "6"
url = "2"
base64 = "0.22"
zbus = "4.4"
futures-util = "0.3"
md5 = "0.8"
mime_guess = "2"
png = "0.17"
notify = "8"
# Use the native renderer's existing dependencies for app-owned PNG capture.
anyrender = { version = "0.6.2", default-features = false }
blitz-dom = { version = "0.2.4", default-features = false }
blitz-net = "0.2.1"
blitz-paint = "0.2.1"
blitz-traits = "0.2.0"
# Local timestamps from the system zoneinfo database.
jiff = { version = "0.2", default-features = false, features = ["std", "tz-system", "tzdb-zoneinfo"] }
# Own the event loop: Blitz 0.2 has no wheel or resize DOM events.
winit = "=0.30.13"
blitz-shell = { version = "0.2.3", default-features = false }
anyrender_vello_cpu = { version = "=0.8.1", default-features = false, features = ["softbuffer_window_renderer", "multithreading"] }
anyrender_vello = { version = "0.6", default-features = false }
vello_cpu = { version = "=0.0.4", default-features = false, features = ["std", "text", "multithreading"] }
libc = "0.2"
wl-clipboard-rs = "0.9"
wayland-client = "0.31"
# Blitz's text editor must read the same Wayland clipboard as file paste.
arboard = { version = "3.6", default-features = false, features = ["wayland-data-control"] }

[patch.crates-io]
blitz-dom = { path = "vendor/blitz-dom-0.2.4" }
blitz-shell = { path = "vendor/blitz-shell-0.2.3" }
accesskit_unix = { path = "vendor/accesskit_unix-0.13.1" }

[profile.dev]
debug = 0

[profile.release]
lto = "thin"
strip = true

