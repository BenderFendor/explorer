name: Rust checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libxkbcommon-dev libgtk-3-dev libdbus-1-dev libudev-dev pkg-config clang
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Format Rust for compilation
        run: cargo fmt --all
      - name: Run tests
        run: cargo test --locked
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Check Rust extension examples
        run: |
          cargo check --manifest-path scripts/extensions/import_annotations/Cargo.toml
          cargo check --manifest-path scripts/extensions/organize_folder/Cargo.toml
          cargo test --manifest-path scripts/extensions/pinterest_import/Cargo.toml
          cargo check --manifest-path scripts/extensions/cosmos_import/Cargo.toml
      - name: Commit formatted sources
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -u
            git commit -m "style: format Rust sources"
            git push origin HEAD:main
          fi
